name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A second push to a pull request's branch cancels the run still in flight.
# A push to main gets a group of its own, keyed by commit, so no run there is
# ever cancelled or replaced while pending: each one checks the version rule
# against main as it was before that push, and a cancelled run checks nothing.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

# Every Ubuntu job is pinned to a release, because ubuntu-latest moves on its
# own: its move to 26.04 brought GNU awk 5.3, which stopped the hook's command
# classifier with an internal error until hooks/classify-command.awk passed
# the words it gives base(), and the wrapper entry it gives has(), as values.
# The check job runs on 24.04 and 26.04, so both the older and the newer Linux
# awk stay covered. The plugin and shellcheck jobs stay on 24.04, and moving
# them is its own change.
jobs:
  check:
    # macOS ships bash 3.2, Linux ships 5.x. The scripts target both, so both
    # run. --doctor is left out: a fresh runner has no Claude Code install to
    # inspect.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned to a commit, because a moving tag on the only gate this repo
      # has is a gate someone else can change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version rule compares against origin/main, which a shallow
          # clone does not have.
          fetch-depth: 0
      - run: bash --version | head -1
      - run: jq --version
      - run: node --version
      # On a pull request the version rule compares with origin/main. On a
      # push to main it compares with main as it was before the push, so two
      # pull requests that each bumped to the same version fail here once the
      # second lands, rather than shipping its changes to nobody.
      # check.sh runs the stats fixtures only where Node 18.1 or later is
      # installed, and warns otherwise. REQUIRE_NODE makes a runner without
      # it fail rather than skip them.
      - run: ./scripts/check.sh
        env:
          REQUIRE_NODE: 1
          CHECK_BASE: ${{ github.event_name == 'push' && github.event.before || 'origin/main' }}

  plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned, because the validator's rules change with each release, and a
      # gate that moves on its own is one someone else controls. It needs no
      # login: it reads the manifests and makes no model call.
      - run: CLAUDE_BIN="npx --yes @anthropic-ai/claude-code@2.1.293" ./scripts/validate-plugin.sh

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Two version numbers, and they count different things. package.json
      # pins the npm wrapper at 4.1.0; that wrapper downloads koalaman's
      # shellcheck and takes the latest unless told otherwise, so
      # SHELLCHECKJS_RELEASE pins the binary at 0.11.0. Without it the binary
      # moved on its own, which is what disagreed with a local 0.11.0 about
      # SC2015. `npm run lint` carries both, so this prints through it rather
      # than calling npx directly and reporting a version the lint never used.
      - run: npm run lint -- --version
      - run: npm run lint
